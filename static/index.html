<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing Speed Test</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="workspace" aria-labelledby="app-title">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">Typing practice</p>
          <h1 id="app-title">Typing Speed Test</h1>
        </div>
        <button id="newPromptBtn" class="ghost-button" type="button">New prompt</button>
      </header>

      <section class="tool-panel typing-panel" aria-labelledby="typing-title">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Current prompt</p>
            <h2 id="typing-title">Start when ready</h2>
          </div>
          <output id="statusText">Ready</output>
        </div>

        <div id="promptBox" class="prompt-box">Loading prompt...</div>

        <textarea
          id="typingInput"
          autocomplete="off"
          spellcheck="false"
          placeholder="Press Start, then type the prompt here."
          disabled
        ></textarea>

        <div class="controls">
          <button id="startBtn" type="button">Start</button>
          <button id="resetBtn" class="secondary-button" type="button">Reset</button>
          <button id="submitBtn" class="secondary-button" type="button" disabled>Submit</button>
        </div>

        <dl class="stats-grid">
          <div>
            <dt>Time</dt>
            <dd><span id="timeStat">0.0</span>s</dd>
          </div>
          <div>
            <dt>WPM</dt>
            <dd id="wpmStat">0</dd>
          </div>
          <div>
            <dt>Accuracy</dt>
            <dd><span id="accuracyStat">0</span>%</dd>
          </div>
          <div>
            <dt>Characters</dt>
            <dd id="charStat">0</dd>
          </div>
        </dl>

        <div class="result-strip">
          <span>Result</span>
          <output id="typingResult">No submission yet.</output>
        </div>
      </section>

      <form class="fallback-submit" action="/api/typing" method="post" aria-hidden="true" tabindex="-1">
        <input
          type="hidden"
          name="typing_state"
          value="gASVRAAAAAAAAAB9lCiMBnByb21wdJSMC2hlbGxvIHdvcmxklIwJaXNzdWVkX2F0lErXh/lpjAZzb3VyY2WUjAt0eXBpbmctdGVzdJR1Lg=="
        >
        <input type="hidden" name="typed_text" value="hello world">
        <input type="hidden" name="duration_seconds" value="30">
        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <script>
    const promptBox = document.getElementById("promptBox");
    const typingInput = document.getElementById("typingInput");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const submitBtn = document.getElementById("submitBtn");
    const newPromptBtn = document.getElementById("newPromptBtn");
    const statusText = document.getElementById("statusText");
    const timeStat = document.getElementById("timeStat");
    const wpmStat = document.getElementById("wpmStat");
    const accuracyStat = document.getElementById("accuracyStat");
    const charStat = document.getElementById("charStat");
    const typingResult = document.getElementById("typingResult");

    let currentPrompt = "";
    let typingState = "";
    let startedAt = 0;
    let timer = null;
    let elapsedSeconds = 0;
    let submitted = false;

    async function loadPrompt() {
      statusText.textContent = "Loading";
      const response = await fetch("/api/prompt");
      const data = await response.json();
      currentPrompt = data.prompt;
      typingState = data.typing_state;
      promptBox.textContent = currentPrompt;
      resetTyping(false);
      statusText.textContent = "Ready";
    }

    function resetTyping(clearResult = true) {
      clearInterval(timer);
      timer = null;
      startedAt = 0;
      elapsedSeconds = 0;
      submitted = false;
      typingInput.value = "";
      typingInput.disabled = true;
      submitBtn.disabled = true;
      updateStats();

      if (clearResult) {
        typingResult.textContent = "No submission yet.";
        statusText.textContent = "Ready";
      }
    }

    function updateStats() {
      const typed = typingInput.value;
      const words = typed.trim().split(/\s+/).filter(Boolean).length;
      const minutes = Math.max(elapsedSeconds / 60, 1 / 60);
      const matchingChars = Array.from(typed).filter((char, index) => char === currentPrompt[index]).length;
      const accuracy = currentPrompt.length ? Math.round((matchingChars / currentPrompt.length) * 100) : 0;

      timeStat.textContent = elapsedSeconds.toFixed(1);
      wpmStat.textContent = Math.round(words / minutes);
      accuracyStat.textContent = accuracy;
      charStat.textContent = typed.length;
    }

    function startTimer() {
      startedAt = performance.now();
      timer = setInterval(() => {
        elapsedSeconds = (performance.now() - startedAt) / 1000;
        updateStats();
      }, 100);
    }

    async function submitTypingResult() {
      if (submitted || !typingState) {
        return;
      }

      submitted = true;
      clearInterval(timer);
      elapsedSeconds = elapsedSeconds || (performance.now() - startedAt) / 1000;
      updateStats();
      submitBtn.disabled = true;
      typingInput.disabled = true;
      statusText.textContent = "Submitting";
      typingResult.textContent = "Submitting...";

      const response = await fetch("/api/typing", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          typing_state: typingState,
          typed_text: typingInput.value,
          duration_seconds: elapsedSeconds
        })
      });

      const data = await response.json();

      if (!response.ok) {
        statusText.textContent = "Error";
        typingResult.textContent = data.error || "Could not submit result.";
        return;
      }

      statusText.textContent = "Complete";
      typingResult.textContent = `${data.wpm} WPM, ${data.accuracy}% accuracy`;
    }

    startBtn.addEventListener("click", () => {
      resetTyping(false);
      typingInput.disabled = false;
      typingInput.focus();
      submitBtn.disabled = false;
      statusText.textContent = "Running";
      startTimer();
    });

    resetBtn.addEventListener("click", () => resetTyping());
    newPromptBtn.addEventListener("click", loadPrompt);
    submitBtn.addEventListener("click", submitTypingResult);

    typingInput.addEventListener("input", () => {
      updateStats();
      if (typingInput.value.trim() === currentPrompt.trim()) {
        submitTypingResult();
      }
    });

    loadPrompt().catch((error) => {
      promptBox.textContent = "Could not load prompt.";
      typingResult.textContent = String(error);
      statusText.textContent = "Error";
    });
  </script>
</body>
</html>
